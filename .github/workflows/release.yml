name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, e.g. v1.2.3 — a GitHub Release + GHCR image are created for this tag at the branch/commit you run from."
        required: true
        type: string

permissions:
  contents: write # create releases
  packages: write # push to GHCR

jobs:
  verify:
    name: verify (vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
      # Gate the release on the same fast checks CI runs, so a broken tag can
      # never publish binaries or an image.
      - run: go vet ./...
      - run: go test ./...

  binaries:
    name: build static binaries
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Build + package
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          # TAG (e.g. v1.2.3) names the artifact; the embedded version is SemVer
          # + a yyyyMMdd-HHmmss-<sha> build id (scripts/version.sh), so a binary
          # always reports exactly when and from which commit it was built.
          TAG="${{ inputs.tag || github.ref_name }}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y%m%d-%H%M%S)"
          VERSION="$(BASE_VERSION="${TAG#v}" GIT_SHA="$COMMIT" BUILD_TIME="$DATE" sh scripts/version.sh)"
          PKG=github.com/netikras/procfit/internal/meta
          mkdir -p dist build
          go build -trimpath -ldflags "-s -w \
            -X ${PKG}.Version=${VERSION} \
            -X ${PKG}.Commit=${COMMIT} \
            -X ${PKG}.BuildDate=${DATE}" \
            -o build/procfit ./cmd/procfit
          base="procfit_${TAG}_linux_${GOARCH}"
          tar -C build -czf "dist/${base}.tar.gz" procfit
          ( cd dist && sha256sum "${base}.tar.gz" > "${base}.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: procfit-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    # Publish on a tag push, or on a manual run (which supplies the tag input).
    # A manual run creates the tag at the commit you dispatched from.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true

  image:
    name: build + push GHCR image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}

      # Same SemVer + yyyyMMdd-HHmmss-<sha> build id stamped into the image binary.
      - id: ver
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          SHA="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y%m%d-%H%M%S)"
          VERSION="$(BASE_VERSION="${TAG#v}" GIT_SHA="$SHA" BUILD_TIME="$DATE" sh scripts/version.sh)"
          { echo "version=$VERSION"; echo "commit=$SHA"; echo "date=$DATE"; } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}
            DATE=${{ steps.ver.outputs.date }}
