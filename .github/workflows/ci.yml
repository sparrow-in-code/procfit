name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build / test / cover / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Format check
        run: |
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then echo "not gofmt-clean:"; echo "$out"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

      - name: Coverage (>=80% gate)
        run: make cover

      - name: Fuzz smoke
        run: FUZZTIME=8s ./scripts/fuzz-smoke.sh

      - name: golangci-lint (size caps + static analysis)
        uses: golangci/golangci-lint-action@v8
        with:
          # Pin a golangci-lint v2 built with Go >= go.mod's target (1.26.7).
          # `latest` on action@v6 resolves to the v1 line (1.64.8, built with
          # go1.24), which both rejects our v2 .golangci.yml and refuses a
          # newer Go target. v2.13.2 is built with go1.27.1 and matches local.
          version: v2.13.2

  nix:
    name: nix flake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build the flake package
        run: nix build .#procfit --print-build-logs
